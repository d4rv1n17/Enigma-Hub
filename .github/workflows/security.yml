name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate update and installer protections
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m py_compile enigma_hub.py hub_setup.py hub_update.py hub_experience.py hub_safety.py hub_products.py build_release.py
      - name: Check known package vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt
